name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1

      - name: goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.6.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: post-release cosign verify
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p verify && cd verify
          gh release download "$TAG" --repo "${{ github.repository }}"
          # Pick one platform to verify
          asset="$(ls wotw-verify_*_linux_x86_64.tar.gz | head -1)"
          if [ -z "$asset" ]; then
            echo "no linux x86_64 archive in the release"
            exit 1
          fi
          cosign verify-blob \
            --key ../cosign.pub \
            --signature "${asset}.sig" \
            "$asset"
          echo "OK release artifact cosign signature verifies"

  homebrew-test:
    runs-on: macos-14   # darwin-arm64 (Apple Silicon)
    needs: release
    if: ${{ !contains(github.ref_name, '-rc') && !contains(github.ref_name, '-alpha') && !contains(github.ref_name, '-beta') }}
    steps:
      - name: install via Homebrew tap
        run: |
          brew tap DriftVane/tap
          brew install wotw-verify
          wotw-verify --version
          wotw-verify --self-test

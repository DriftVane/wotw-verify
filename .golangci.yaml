run:
  timeout: 5m

linters:
  disable-all: true
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - gofmt
    - goimports
    - revive
    - bodyclose
    - gosec

linters-settings:
  gosec:
    excludes:
      - G304 # File path provided as input to function — we read user-supplied pack paths intentionally
  revive:
    rules:
      - name: exported
        severity: warning
        disabled: true # we document exported symbols via package-level docs

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
    - path: internal/fixturegen/
      linters:
        - gosec
